version: 2
updates:
  # ビルド/開発ツール（npm）
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"   # 推移的依存の単体PRを止める（脆弱性は下の security グループで拾う）
    groups:
      # 通常のバージョン更新は minor/patch を1本にまとめる（major は破壊的変更を切り分けるため個別PRで届く）
      npm-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      # 脆弱性修正（推移的依存含む）もまとめて1本に
      npm-security:
        applies-to: security-updates
        patterns: [ "*" ]

  # 本番依存（composer / vendorに同梱される側）
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "direct"
    groups:
      composer-dependencies:
        patterns: [ "*" ]
        update-types: [ "minor", "patch" ]
      composer-security:
        applies-to: security-updates
        patterns: [ "*" ]
